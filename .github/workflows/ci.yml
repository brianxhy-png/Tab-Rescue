name: Check extension

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1)"
